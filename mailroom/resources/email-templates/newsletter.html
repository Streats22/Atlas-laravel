<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:0;background:#eef2f7;font-family:Helvetica,Arial,sans-serif;color:#1f2937">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#eef2f7;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:8px;overflow:hidden">
        <tr><td style="background:#0f766e;color:#ffffff;padding:28px 32px">
          <div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.8">{{ audience_name }}</div>
          <div style="font-size:28px;font-weight:bold;margin-top:6px">This month's highlights</div>
        </td></tr>
        <tr><td style="padding:28px 32px;font-size:16px;line-height:1.6">
          <p>Hi {{ first_name | there }}, here is what happened this month.</p>
          <h2 style="font-size:20px;margin:24px 0 8px">First story</h2>
          <p>A short summary of your first story. <a href="https://example.com/story-1" style="color:#0f766e">Read more →</a></p>
          <h2 style="font-size:20px;margin:24px 0 8px">Second story</h2>
          <p>A short summary of your second story. <a href="https://example.com/story-2" style="color:#0f766e">Read more →</a></p>
          <h2 style="font-size:20px;margin:24px 0 8px">Quick links</h2>
          <ul style="padding-left:20px"><li><a href="https://example.com/events" style="color:#0f766e">Upcoming events</a></li><li><a href="https://example.com/blog" style="color:#0f766e">Blog</a></li></ul>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
