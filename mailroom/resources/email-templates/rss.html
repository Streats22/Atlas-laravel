<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Helvetica,Arial,sans-serif;color:#18181b">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:8px">
        <tr><td style="padding:28px 32px 8px">
          <div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b7280">{{ audience_name }}</div>
          <h1 style="font-size:26px;margin:6px 0 0">New on the blog</h1>
        </td></tr>
        <tr><td style="padding:16px 32px 28px;font-size:16px;line-height:1.6">
          {{ rss_items }}
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
